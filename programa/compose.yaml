name: kempingu-portalas

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_AUTHOR: ${APP_AUTHOR:-Vardas Pavardė}
      DB_PASSWORD: ${DB_PASSWORD:-stud}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      MAIL_FROM: ${MAIL_FROM:-portalas@example.lt}
    volumes:
      - ./app:/var/www/app:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    environment:
      MYSQL_PASSWORD: ${DB_PASSWORD:-stud}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-stud}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAIL_PORT:-8025}:8025"
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
